services:
    postgres_test:
        image: 'postgres:17'
        environment:
            - 'POSTGRES_DB=postgres_test'
            - 'POSTGRES_PASSWORD=postgres'
            - 'POSTGRES_USER=postgres'
        ports:
            - '54325:5432'
        volumes:
            - type: tmpfs
              target: /var/lib/postgresql/data
              tmpfs:
                  size: 100M
